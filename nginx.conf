server {

    server_name emrahdiril.com www.emrahdiril.com;

    root /var/www/emrahdiril;
    index index.php index.html;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
    }

    location ~ /\.ht {
        deny all;
    }

    location /notes/ {
        try_files $uri $uri/ /notes/index.php?$query_string;
    }

    location ^~ /notes/wp-content/database/ {
        deny all;
        return 404;
    }

    location /gallery/ {
        try_files $uri $uri/ /gallery/index.php?$query_string;
    }

    location ~* \.(sqlite|sqlite3|db)$ {
        deny all;
        return 404;
    }

    location = /millionminds {
        return 301 /millionminds/;
    }

    location /millionminds/ {
        try_files $uri $uri/ /millionminds/index.php?$query_string;
    }

    location /millionminds/notes/ {
        try_files $uri $uri/ /millionminds/notes/index.php?$query_string;
    }

    location ^~ /millionminds/notes/wp-content/database/ {
        return 404;
    }

    listen 443 ssl; # managed by Certbot
    listen [::]:443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/emrahdiril.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/emrahdiril.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.emrahdiril.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = emrahdiril.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;

    server_name emrahdiril.com www.emrahdiril.com;
    return 404; # managed by Certbot
}
